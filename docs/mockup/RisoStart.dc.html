<style>
body{margin:0}
a{color:#B4161B}a:hover{color:#8A0F13}
@keyframes bob{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-10px) rotate(calc(var(--r,0deg) + 3deg))}}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes pop{0%{transform:scale(.2) rotate(-12deg);opacity:0}60%{transform:scale(1.15) rotate(4deg);opacity:1}100%{transform:scale(1) rotate(-3deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes dash{to{stroke-dashoffset:-60}}
@keyframes pulse{0%{transform:scale(.6);opacity:.7}100%{transform:scale(2.4);opacity:0}}
@keyframes rise{0%{transform:translateY(12px) rotate(var(--r,0deg));opacity:0}100%{transform:translateY(0) rotate(var(--r,0deg));opacity:1}}
@keyframes fall{0%{transform:translateY(-120px) rotate(0)}100%{transform:translateY(980px) rotate(540deg)}}
@keyframes kenburns{0%{transform:scale(1.05)}100%{transform:scale(1.18) translate(-10px,-14px)}}
@keyframes wiggle{0%,90%,100%{transform:rotate(0)}93%{transform:rotate(-6deg)}96%{transform:rotate(6deg)}}
@keyframes steam{0%{transform:translateY(0);opacity:0}30%{opacity:.8}100%{transform:translateY(-22px);opacity:0}}
@keyframes draw{from{stroke-dashoffset:400}to{stroke-dashoffset:0}}
.bob{animation:bob 4.5s ease-in-out infinite}
.sway{animation:sway 5s ease-in-out infinite;transform-origin:50% 0}
.pop{animation:pop .9s cubic-bezier(.2,.9,.3,1.3) both}
.rise{animation:rise .7s ease both}
.wiggle{animation:wiggle 4s ease-in-out infinite}
.draw{stroke-dasharray:400;animation:draw 1.6s ease .3s both}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.kb{animation:kenburns 18s ease-in-out infinite alternate}

</style>
